<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#3D7534">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Panel de Time Bite: pedidos por WhatsApp, publicaciones y clientes. Versión de demostración.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Time Bite">
  <title>Time Bite · Panel</title>
  <link rel="icon" href="assets/img/logo-verde.webp" type="image/webp">
  <link rel="apple-touch-icon" href="assets/img/logo-verde.webp">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Lilita+One&family=Montserrat:wght@400..900&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/studio.css">
  <script defer src="js/data.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/sim.js"></script>
  <script defer src="js/views.js"></script>
  <script defer src="js/bot.js"></script>
  <script defer src="js/chat.js"></script>
  <script defer src="js/content.js"></script>
  <script defer src="js/studio.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-head">
      <img class="app-logo" src="assets/img/logo.webp" alt="Time Bite" width="774" height="613">
      <h1 class="app-title" id="app-title">Inicio</h1>
      <span class="app-status" id="app-status">Abierto</span>
    </header>

    <main class="app-main" id="app-main">
      <section class="view" id="view-inicio" aria-labelledby="app-title"></section>
      <section class="view" id="view-pedidos" aria-labelledby="app-title" hidden></section>
      <section class="view" id="view-contenido" aria-labelledby="app-title" hidden></section>
      <section class="view" id="view-clientes" aria-labelledby="app-title" hidden></section>
      <section class="view" id="view-ajustes" aria-labelledby="app-title" hidden></section>
      <footer class="app-credit">
        <img src="assets/img/isotipo-verde.webp" alt="" width="504" height="512">
        <span>Desarrollado por <b>VanguardIA</b> · Versión de demostración</span>
      </footer>
      <noscript><p class="empty">Activa JavaScript en tu navegador para usar el panel de Time Bite.</p></noscript>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Secciones">
      <button type="button" class="tab" data-view="inicio"><span class="tab-ic"></span><span class="tab-lb">Inicio</span></button>
      <button type="button" class="tab" data-view="pedidos"><span class="tab-ic"><span class="tab-badge" hidden></span></span><span class="tab-lb">Pedidos</span></button>
      <button type="button" class="tab" data-view="contenido"><span class="tab-ic"></span><span class="tab-lb">Contenido</span></button>
      <button type="button" class="tab" data-view="clientes"><span class="tab-ic"></span><span class="tab-lb">Clientes</span></button>
      <button type="button" class="tab" data-view="ajustes"><span class="tab-ic"></span><span class="tab-lb">Ajustes</span></button>
    </nav>
  </div>
</body>
</html>
